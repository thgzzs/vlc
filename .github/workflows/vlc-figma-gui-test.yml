name: Test packaged VLC native Windows GUI
on:
  push:
    branches: [figma-redesign-gui-tests]
    paths:
      - .github/workflows/vlc-figma-gui-test.yml
      - scripts/test-figma-windows-gui.ps1
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-gui:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate GUI test script syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/test-figma-windows-gui.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'GUI test script has syntax errors' }
      - name: Wait for the exact Windows build under test
        id: build
        uses: actions/github-script@v8
        with:
          script: |
            const runId = 38609164261;
            const deadline = Date.now() + 90 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: runId
              });
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(`Build ${runId} concluded ${run.conclusion}; GUI tests cannot run`);
                }
                core.setOutput('run-id', String(runId));
                core.setOutput('source-sha', run.head_sha);
                return;
              }
              core.info(`Build ${runId}: ${run.status}`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for the Windows package');
      - uses: actions/download-artifact@v4
        with:
          name: vlc-juxtopposed-windows-x64
          path: ${{ runner.temp }}/vlc-redesign
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Test native Qt startup and Play/Pause
        shell: powershell
        run: |
          ./scripts/test-figma-windows-gui.ps1 -PackageDirectory "$env:RUNNER_TEMP/vlc-redesign" -OutputDirectory "$env:RUNNER_TEMP/vlc-gui-results"
          Get-Content "$env:RUNNER_TEMP/vlc-gui-results/results.json"
      - name: Preserve GUI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vlc-windows-gui-evidence
          path: ${{ runner.temp }}/vlc-gui-results/
          if-no-files-found: warn
