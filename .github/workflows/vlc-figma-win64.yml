name: Build VLC Figma Win64
on:
  push:
    branches: [figma-redesign]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
  pull_request:
    branches: [figma-redesign]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: vlc-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      # GitHub mounts runner command files with host ownership.
      options: --user 0:0
    env:
      JOBS: "4"
      MESON_BUILD: "-j 2"
      LDFLAGS: "-static-libgcc"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Figma UI source and assets
        run: |
          python3 scripts/check-figma-redesign.py
          python3 redesign/tools/buildlists.py
          c++ -std=c++17 -O2 -Wall -Wextra -Werror redesign/tests/subtitle_cues.cpp -o "$RUNNER_TEMP/subtitle-cues-test"
          "$RUNNER_TEMP/subtitle-cues-test"
      - name: Compile Windows VLC
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Match upstream's contrib cache to the source history and toolchain.
          VLC_CONTRIB_SHA="$(extras/ci/get-contrib-sha.sh win64)"
          # A source-tree repair or launcher-only change need not invalidate the
          # upstream cache. Compare actual dependency/build sources before reuse.
          VLC_UPSTREAM_CONTRIB_SHA="d83cb23375405257164b5c073c6370e180608632"
          if git diff --quiet "$VLC_UPSTREAM_CONTRIB_SHA" HEAD -- contrib extras/tools extras/ci extras/package/win32 ':!extras/package/win32/vlc-juxtopposed.cmd'; then
            VLC_CONTRIB_SHA="$VLC_UPSTREAM_CONTRIB_SHA"
          fi
          export VLC_PREBUILT_CONTRIBS_URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${VLC_CONTRIB_SHA}.tar.zst"
          prebuilt_flag=""
          if extras/ci/check-url.sh "$VLC_PREBUILT_CONTRIBS_URL"; then
            prebuilt_flag="-p"
          else
            unset VLC_PREBUILT_CONTRIBS_URL
          fi
          # Keep contrib Cargo projects outside VLC's Rust workspace.
          mkdir -p "$RUNNER_TEMP/vlc-build"
          cd "$RUNNER_TEMP/vlc-build"
          "$GITHUB_WORKSPACE/extras/package/win32/build.sh" -a x86_64 $prebuilt_flag
          # Cached CMake .pc files explicitly add -lgcc_s to these C plugin
          # links. Driver flags cannot override an explicit shared-library name.
          python3 - "$RUNNER_TEMP/vlc-build/win64/modules/Makefile" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          for key in ("SRT_LIBS", "LIBS_x265", "LIBS_gme"):
              pattern = re.compile(r"^(" + key + r"\s*=\s*)(.*)$", re.M)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"Missing generated link variable: {key}")
              libs, count = re.subn(r"(?<!\S)-lgcc_s(?!\S)", "-lgcc_eh -lgcc", match[2])
              if not count:
                  raise SystemExit(f"Expected explicit shared GCC dependency in {key}: {match[2]}")
              print(f"{key}: {libs}")
              text = text[:match.start(2)] + libs + text[match.end(2):]
          path.write_text(text)
          PY
          cd "$RUNNER_TEMP/vlc-build/win64/modules"
          for plugin in libaccess_srt_plugin libaccess_output_srt_plugin libx265_plugin libgme_plugin; do
            rm -f "$plugin.la" ".libs/$plugin.dll"
          done
          make V=1 libaccess_srt_plugin.la libaccess_output_srt_plugin.la libx265_plugin.la libgme_plugin.la
          python3 - <<'PY'
          import re, subprocess
          for name in ("libaccess_srt_plugin", "libaccess_output_srt_plugin", "libx265_plugin", "libgme_plugin"):
              output = subprocess.check_output(["x86_64-w64-mingw32-objdump", "-p", f".libs/{name}.dll"], text=True)
              imports = re.findall(r"DLL Name:\s*(\S+)", output)
              print(f"{name}: {imports}")
              if any(dll.lower().startswith(("libgcc_s", "libstdc++")) for dll in imports):
                  raise SystemExit(f"{name} still imports a shared C++ runtime")
          PY
      - name: Package VLC
        run: |
          set -eu
          cd "$RUNNER_TEMP/vlc-build/win64"
          make package-win-strip
          cd "$GITHUB_WORKSPACE"
          mkdir -p packaged
          p="$(find "$RUNNER_TEMP/vlc-build/win64" -type f -path '*/vlc-*-dev/vlc.exe' -print -quit)"
          test -n "$p"
          # C++ contrib plugins can import the matching MinGW runtime DLLs.
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            runtime="$(x86_64-w64-mingw32-g++ -print-file-name="$dll")"
            test -f "$runtime"
            cp "$runtime" "$(dirname "$p")/"
          done
          cp "$GITHUB_WORKSPACE/extras/package/win32/vlc-juxtopposed.cmd" "$(dirname "$p")/"
          cp -a "$(dirname "$p")" packaged/
      - uses: actions/upload-artifact@v4
        with:
          name: vlc-juxtopposed-windows-x64
          path: packaged/
          if-no-files-found: error
  smoke-test:
    needs: build-win64
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vlc-juxtopposed-windows-x64
          path: ${{ runner.temp }}/vlc-redesign
      - name: Verify packaged engine startup and exit
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:RUNNER_TEMP\vlc-redesign" -Recurse -Filter vlc.exe -File | Select-Object -First 1
          if (-not $exe) { throw "Missing vlc.exe" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName "plugins"))) { throw "Missing plugins" }
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--ignore-config --no-one-instance --intf=dummy --reset-plugins-cache vlc://quit' -WorkingDirectory $exe.DirectoryName -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP\stderr.txt"
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            throw "Packaged VLC did not exit within 60 seconds; inspect stdout/stderr"
          }
          if ($proc.ExitCode -ne 0) { throw "Packaged VLC returned $($proc.ExitCode)" }
          if (Select-String -Path "$env:RUNNER_TEMP\stderr.txt" -SimpleMatch 'cannot load plug-in' -Quiet) {
            throw "A packaged plugin could not load; inspect stderr.txt"
          }
      - name: Preserve Windows startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vlc-windows-startup-logs
          path: |
            ${{ runner.temp }}/stdout.txt
            ${{ runner.temp }}/stderr.txt
          if-no-files-found: warn
  gui-test:
    needs: build-win64
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vlc-juxtopposed-windows-x64
          path: ${{ runner.temp }}/vlc-redesign
      - name: Validate Windows test script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/test-figma-windows-gui.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Verify native audio playback and controls
        shell: pwsh
        run: |
          ./scripts/test-figma-windows-gui.ps1 -PackageDirectory "$env:RUNNER_TEMP/vlc-redesign" -OutputDirectory "$env:RUNNER_TEMP/gui-evidence/audio"
      - name: Generate local video and subtitle fixtures
        shell: pwsh
        run: python scripts/make-vlc-qa-media.py "$env:RUNNER_TEMP/qa-media"
      - name: Verify native video, fullscreen and playback tools
        shell: pwsh
        run: |
          ./scripts/test-figma-windows-gui.ps1 -PackageDirectory "$env:RUNNER_TEMP/vlc-redesign" -OutputDirectory "$env:RUNNER_TEMP/gui-evidence/video" -VideoFixture "$env:RUNNER_TEMP/qa-media/video-fixture.avi"
      - name: Audit packaged Windows DLL imports
        if: always()
        shell: pwsh
        run: python scripts/audit-windows-runtime.py "$env:RUNNER_TEMP/vlc-redesign" "$env:RUNNER_TEMP/gui-evidence/runtime-imports.json"
      - name: Preserve native Windows GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vlc-native-windows-gui-evidence
          path: ${{ runner.temp }}/gui-evidence/
          if-no-files-found: warn
